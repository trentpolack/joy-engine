<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>SCENE EFFECTS · Joy Engine</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0d1a20;
      color: #e8eeee;
      font: 14px system-ui, sans-serif;
    }

    #joy-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
      touch-action: none;
    }

    #joy-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      letter-spacing: 0.2em;
      pointer-events: none;
    }

    #joy-canvas[data-ready] + #joy-loading {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="joy-canvas" tabindex="0"></canvas>
  <div id="joy-loading">LOADING</div>
  <script type="module">
    import start from './scene_effects.js';

    const canvas = document.getElementById('joy-canvas');
    // The shell sizes the canvas once the GPU is ready; hide the loading label then.
    new ResizeObserver(() => {
      if(canvas.width > 0) {
        canvas.dataset.ready = 'true';
      }
    }).observe(canvas);
    start().then(() => canvas.focus()).catch(error => {
      document.getElementById('joy-loading').textContent = `Unable to start: ${error}`;
    });
  </script>
</body>
