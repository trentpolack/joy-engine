# Joy Engine physics. The only crate that depends on rapier; enhanced determinism keeps native and WebAssembly
# simulations identical.
#
#   cargo test -p joy-physics

[package]
name = "joy-physics"
description = "Joy Engine physics: deterministic rigid bodies, vehicles, SDF contacts, terrain colliders, and destruction on rapier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
joy-core.workspace = true
joy-render-types.workspace = true
joy-terrain.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
rapier3d.workspace = true

[dev-dependencies]
joy-test-support.workspace = true

# Architecture layer, enforced by `npm run check` (see `[workspace.metadata.joy]` in the workspace manifest).
[package.metadata.joy]
layer = "simulation"

[lints]
workspace = true
