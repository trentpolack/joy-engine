# Joy Engine authoring kit: the egui controls, panel layout, property history, script editor, viewport gestures, and
# file dialogs FORM EDITOR, JOYFX EDITOR, and Joy Editor share, plus the contract that hosts tools as editor tabs.
#
#   cargo test -p joy-authoring

[package]
name = "joy-authoring"
description = "Joy Engine authoring kit: lab controls, panel layout, property history, the script editor, file dialogs, and tool hosting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
joy-app.workspace = true
joy-core.workspace = true
joy-form.workspace = true
joy-fx.workspace = true
joy-storage.workspace = true
joy-ui.workspace = true
egui.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

# Architecture layer, enforced by `npm run check` (see `[workspace.metadata.joy]` in the workspace manifest).
[package.metadata.joy]
layer = "platform"

[lints]
workspace = true
