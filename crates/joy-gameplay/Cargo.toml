# Joy Engine gameplay: the entity world, components and their schemas, controllers and characters, grid navigation,
# and authored level and object documents. Headless; physics comes from `joy-physics`.
#
#   cargo test -p joy-gameplay

[package]
name = "joy-gameplay"
description = "Joy Engine gameplay: entities, components, controllers, navigation, and level documents and runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
# Integration tests are one binary listed below.
autotests = false

[[test]]
name = "joy-gameplay"
path = "test/rust/main.rs"

[dependencies]
joy-core.workspace = true
joy-physics.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true

[dev-dependencies]
joy-test-support.workspace = true

[lints]
workspace = true
