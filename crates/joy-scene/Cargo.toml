# Joy Engine scene presentation: levels, per-entity particle effects, and FORM meshes turned into renderer scenes. The
# bridge that keeps `joy-renderer` independent of gameplay, FORM, and particle documents.
#
#   cargo test -p joy-scene

[package]
name = "joy-scene"
description = "Joy Engine scene presentation: levels, FORM meshes, and particle effects drawn through the renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
joy-core.workspace = true
joy-render-types.workspace = true
joy-environment.workspace = true
joy-form.workspace = true
joy-fx.workspace = true
joy-gameplay.workspace = true
joy-renderer.workspace = true
indexmap.workspace = true
libm.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Recorded component schemas compare through the shared fixture helpers.
joy-test-support.workspace = true

# Architecture layer, enforced by `npm run check` (see `[workspace.metadata.joy]` in the workspace manifest).
[package.metadata.joy]
layer = "rendering"

[lints]
workspace = true
