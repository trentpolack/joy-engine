# Joy Engine input: named actions and axes bound to keys, pointer buttons, gamepads, and virtual buttons, with input
# contexts. Native gamepads poll through gilrs; browsers read the Gamepad API.
#
#   cargo test -p joy-input

[package]
name = "joy-input"
description = "Joy Engine input: actions, axes, and contexts over keyboard, pointer, gamepad, and virtual buttons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
glam.workspace = true
indexmap.workspace = true
thiserror.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs.workspace = true
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys.workspace = true

[lints]
workspace = true
