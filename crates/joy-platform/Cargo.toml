[package]
name = "joy-platform"
description = "Joy Engine platform layer: the frame-phase game shell, windows and browser canvases, input, and development UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
joy-foundation.workspace = true
joy-render.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
log.workspace = true
thiserror.workspace = true
web-time.workspace = true
glam.workspace = true
indexmap.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# egui-winit's pinned release does not build for WebAssembly; browsers use `web_input` instead.
egui-winit.workspace = true
pollster.workspace = true
env_logger.workspace = true
image.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "CssStyleDeclaration", "HtmlElement"] }
console_error_panic_hook.workspace = true
console_log.workspace = true

[lints]
workspace = true
