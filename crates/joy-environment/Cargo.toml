# Joy Engine environment simulation: solar time, sun and moon, skylight, and wind. Headless; time is in seconds.
#
#   cargo test -p joy-environment

[package]
name = "joy-environment"
description = "Joy Engine environment simulation: solar time, sun and moon, skylight, and wind."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
joy-core.workspace = true
joy-render-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
joy-test-support.workspace = true

# Architecture layer, enforced by `npm run check` (see `[workspace.metadata.joy]` in the workspace manifest).
[package.metadata.joy]
layer = "simulation"

[lints]
workspace = true
