# The Joy Engine renderer: the one wgpu renderer games, tools, and previews draw with (WebGPU or WebGL 2 in browsers;
# Vulkan, Metal, DirectX 12, or OpenGL natively), including terrain, scene effects, display processing, and particle
# drawing. Shaders are standalone WGSL files under `src/`.
#
#   cargo test -p joy-renderer

[package]
name = "joy-renderer"
description = "The Joy Engine renderer: retained scenes, PBR and lit materials, shadows, terrain, scene effects, and display processing on wgpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
# Integration tests are one binary listed below.
autotests = false

[[test]]
name = "joy-renderer"
path = "test/rust/main.rs"

[dependencies]
joy-core.workspace = true
joy-fx.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
log.workspace = true
web-time.workspace = true
png.workspace = true
zune-jpeg.workspace = true
image-webp.workspace = true
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native shader tests translate WGSL to WebGL GLSL even on Metal-only hosts.
naga.workspace = true
# Headless GPU tests wait on adapter and readback futures.
pollster.workspace = true
# Headless GPU tests write PNG captures to `JOY_RENDER_CAPTURE_DIR`.
image.workspace = true

[lints]
workspace = true
