# Test-only golden-file helpers shared by Joy Engine crates and games. Engine crates take it as a dev-dependency;
# games reach it as `joy_engine::testing` through the facade's `test-support` feature in their dev-dependencies, so
# it never reaches a game build.

[package]
name = "joy-test-support"
description = "Test-only golden-file helpers shared by Joy Engine crates and games."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Shared test helpers; engine crates take this only as a dev-dependency.
[package.metadata.joy]
test-support = true

[lints]
workspace = true
