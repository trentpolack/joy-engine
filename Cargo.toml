# Joy Engine: the `joy-engine` facade package (`src/lib.rs`, the API games and tools use) and the workspace of engine
# crates in `crates/`. Each crate owns one system and names its architecture layer in `[package.metadata.joy]`;
# `[workspace.metadata.joy]` below orders the layers, and `npm run check` enforces both.
#
#   cargo test                          # every engine crate: unit, parity, and headless GPU tests
#   cargo test -p joy-gameplay          # one crate (simulation and content crates build without wgpu or winit)
#   cargo run --example form-viewer     # FORM assets through the engine renderer
#   cargo run --example terrain         # resident continuous-LOD terrain (Dragon Pit)
#   npm run build:web -- --example form-viewer
#
# Versions match joy-apps, so editor tools and games build against the same
# wgpu and egui.

[package]
name = "joy-engine"
description = "A game engine built in Rust for making cross-platform games; the engine is intended for prototyping, procedural generation, and other things that seem fun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Example targets are listed explicitly.
autoexamples = false

[[example]]
name = "form-viewer"
path = "examples/form-viewer/main.rs"

[[example]]
name = "terrain"
path = "examples/terrain/main.rs"

[[example]]
name = "scene-effects"
path = "examples/scene-effects/main.rs"

[[example]]
name = "form-building"
path = "examples/form-building/main.rs"

[[example]]
name = "form-destruction"
path = "examples/form-destruction/main.rs"

[[example]]
name = "sdf-collisions"
path = "examples/sdf-collisions/main.rs"

[dependencies]
# Engine crates. The facade re-exports them under their historical module names (`joy_engine::physics`).
joy-app.workspace = true
joy-audio.workspace = true
joy-authoring.workspace = true
joy-core.workspace = true
joy-dcc-gltf.workspace = true
joy-devtools.workspace = true
joy-environment.workspace = true
joy-form.workspace = true
joy-fx.workspace = true
joy-gameplay.workspace = true
joy-input.workspace = true
joy-physics.workspace = true
joy-project.workspace = true
joy-renderer.workspace = true
joy-scene.workspace = true
joy-storage.workspace = true
joy-ui.workspace = true

# Data and logging, re-exported for games and tools.
serde_json.workspace = true
log.workspace = true

# UI (platform layer), re-exported for HUDs and tools.
egui.workspace = true

# Re-exported for `web_main!`, which declares a game's browser entry point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# Scene-effect render tests read back GPU frames and compare PNG references.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster.workspace = true
image.workspace = true

[lints]
workspace = true

# This package is its own workspace root, including when it is checked out inside a hosting repository. Engine crates
# live in `crates/`; the editor and labs are member packages. `cargo test` at the root tests the facade and every
# engine crate, but not the tools.
[workspace]
members = ["crates/*", "editor", "tools/*"]
default-members = [
  ".",
  "crates/joy-app",
  "crates/joy-audio",
  "crates/joy-authoring",
  "crates/joy-core",
  "crates/joy-dcc-gltf",
  "crates/joy-devtools",
  "crates/joy-environment",
  "crates/joy-form",
  "crates/joy-fx",
  "crates/joy-gameplay",
  "crates/joy-input",
  "crates/joy-physics",
  "crates/joy-project",
  "crates/joy-renderer",
  "crates/joy-scene",
  "crates/joy-storage",
  "crates/joy-test-support",
  "crates/joy-ui",
]

# Shared by the facade, every engine crate, and the tools (which keep their own versions and descriptions).
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Trent Polack"]
repository = "https://github.com/trentpolack/joy-engine"

# One version and feature set per dependency, so crates cannot drift apart (wgpu and egui must match across the
# renderer, the shell, and the tools). Versions match joy-apps.
[workspace.dependencies]
# Engine crates.
joy-app = { path = "crates/joy-app" }
joy-audio = { path = "crates/joy-audio" }
joy-authoring = { path = "crates/joy-authoring" }
joy-core = { path = "crates/joy-core" }
joy-dcc-gltf = { path = "crates/joy-dcc-gltf" }
joy-devtools = { path = "crates/joy-devtools" }
joy-environment = { path = "crates/joy-environment" }
joy-engine = { path = "." }
joy-form = { path = "crates/joy-form" }
joy-fx = { path = "crates/joy-fx" }
joy-gameplay = { path = "crates/joy-gameplay" }
joy-input = { path = "crates/joy-input" }
joy-physics = { path = "crates/joy-physics" }
joy-project = { path = "crates/joy-project" }
joy-renderer = { path = "crates/joy-renderer" }
joy-scene = { path = "crates/joy-scene" }
joy-storage = { path = "crates/joy-storage" }
joy-test-support = { path = "crates/joy-test-support" }
joy-ui = { path = "crates/joy-ui" }

# Math and data.
# `libm` routes glam's own trigonometry (rotations, angles) through the portable libm crate, so it computes the same
# results natively and in WebAssembly.
glam = { version = "0.34.1", features = ["bytemuck", "serde", "libm"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }

# float_roundtrip keeps authored documents byte-stable through a parse/serialize round trip.
serde_json = { version = "1.0.154", features = [
  "preserve_order",
  "float_roundtrip",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
thiserror = "2.0.21"
log = "0.4.34"
web-time = "1.1.0"

# WAV decoding for the audio bank.
hound = "3.5.1"

# Portable IEEE math (FreeBSD msun ports) so particle scripts compute identical transcendental results natively and
# in WebAssembly, and match the TypeScript engine's V8 results for exp, tan, and atan2 bit for bit.
libm = "0.2.16"

# PNG decoding for embedded particle textures on every target (browsers included); already used by `image` natively.
png = "0.18.1"

# JPEG and WebP decoding for embedded FORM material maps (PNG, JPEG, or WebP) on every target, browsers included.
zune-jpeg = "0.5.15"
image-webp = "0.2.4"

# Physics (simulation layer). Enhanced determinism keeps native and WebAssembly simulations identical.
rapier3d = { version = "0.36.1", features = ["enhanced-determinism"] }

# Rendering, windows, and UI (rendering and platform layers). These match joy-apps' pins.
wgpu = { version = "30.0.1", default-features = false, features = [
  "std",
  "wgsl",
  "webgpu",
  "webgl",
  "vulkan",
  "metal",
  "dx12",
  "gles",
] }
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }

# Native only: members list these under `cfg(not(target_arch = "wasm32"))`.
# egui-winit's pinned release does not build for WebAssembly; browsers use `browser::egui_input` instead.
egui-winit = { version = "0.36.2", default-features = false, features = [
  "clipboard",
] }
pollster = "0.4.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Gamepads and audio output (platform layer). Linux builds need the udev and ALSA development packages.
gilrs = "0.11.2"
cpal = "0.18.2"

# Native file dialogs for authoring tools (platform layer, behind development::FileDialogs); the version joy-apps uses.
# The desktop portal backend loads libdbus at run time (falling back to zenity), so Linux builds need no system
# packages; Wayland parent-window support is left out.
rfd = { version = "0.17.2", default-features = false, features = [
  "xdg-portal",
] }

# Native shader tests translate WGSL to WebGL GLSL even on Metal-only hosts.
naga = { version = "30.0.1", features = ["glsl-out"] }


# Browser builds (WebAssembly only).
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = [
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextOptions",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "Element",
  "EventTarget",
  "File",
  "FileList",
  "GainNode",
  "Gamepad",
  "GamepadButton",
  "GamepadMappingType",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "Navigator",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Explicit parenthesized arithmetic is part of the house style; keep clippy from fighting it.
precedence = "allow"

# Engine architecture, enforced by `npm run check` (`scripts/check-boundaries.mjs`). Each crate in `crates/` names its
# layer in `[package.metadata.joy]` (or marks itself `test-support`). A crate may depend only on crates in its own layer
# or an earlier one in `layers`, and on a backend crate only from the layers listed for it. Apps (the editor, the labs,
# the examples, and games) reach all of it through `joy-engine` and never depend on engine or backend crates directly.
[workspace.metadata.joy]
layers = ["foundation", "simulation", "content", "rendering", "platform"]

[workspace.metadata.joy.backend-crates]
# Math types reach every crate through `joy_core::math`, so a math library change stays in one module.
glam = ["foundation"]
rapier3d = ["simulation"]
wgpu = ["rendering", "platform"]
winit = ["platform"]
egui = ["platform"]
egui-wgpu = ["platform"]
egui-winit = ["platform"]
gilrs = ["platform"]
cpal = ["platform"]
rfd = ["platform"]

[profile.dev]
# Line tables keep backtraces useful without multi-gigabyte debug info.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (wgpu, naga, rapier) run optimized even in debug builds, so games stay playable while iterating.
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Browser builds trade a little speed for download size.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
