# Joy Editor on the Rust engine: the authoring workspace for game projects (content browser, document tabs, saves with
# conflict handling, the level editor, and FORM EDITOR and JOYFX EDITOR as hosted tabs). Modules live in `src/` and
# support the native application and browser build.
#
#   cargo run -p joy-editor -- --workspace=<hosting workspace>
#   cargo test -p joy-editor
#   node scripts/rust/build-web.mjs --package joy-editor        # browser build with read-only bundled examples

[package]
name = "joy-editor"
description = "Joy Editor: the Joy Engine authoring workspace for levels, reusable objects, FORM meshes, and particle effects."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
autoexamples = false

[lib]
# `cdylib` is the browser module; `rlib` serves the native binary and tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
joy-engine.workspace = true
# Hosted as tabs through `joy_engine::development::AuthoringTool`, without their own browser entry points.
form-editor = { path = "../tools/form-editor", default-features = false }
joyfx-editor = { path = "../tools/joyfx-editor", default-features = false }

[lints]
workspace = true
