# FORM LAB on the Rust Joy Engine: script procedural geometry with a live engine preview, natively and in browsers,
# standalone or as a Joy Editor tab (`form_lab::FormLab` implements `AuthoringTool`). Modules sit beside the
# TypeScript tool in `src/` and `site/src/`.
#
#   cargo run -p form-lab
#   cargo test -p form-lab
#   node ../../../scripts/rust/build-web.mjs --package form-lab --title "FORM LAB"

[package]
name = "form-lab"
description = "FORM LAB: script procedural geometry with a live Joy Engine preview, natively and in browsers."
version = "0.7.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Trent Polack"]
repository = "https://github.com/trentpolack/joy-engine"
publish = false
# `test/` holds the TypeScript tool's JavaScript tests; the Rust tests are one binary listed below.
autotests = false
autobins = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "form-lab"
path = "src/main.rs"

[[test]]
name = "form-lab"
path = "test/rust/main.rs"

[features]
default = ["web-entry"]
# The browser entry point (`web_main!`). Hosts that embed FORM LAB, such as Joy Editor, turn it off so their own entry
# point is the only one in the build.
web-entry = []

[dependencies]
# Tools depend on the engine alone, like games.
joy-engine = { path = "../../.." }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Explicit parenthesized arithmetic is part of the house style.
precedence = "allow"
