# PARTICLE LAB on the Rust Joy Engine: author layered `.joyfx` particle effects with scripts, child emitters, and a
# live preview drawn by the engine renderer. Runs natively and in browsers, and Joy Editor hosts it as a tab through
# `AuthoringTool`.
#
#   cargo run -p particle-lab
#   cargo test -p particle-lab
#   node scripts/rust/build-web.mjs --package particle-lab --release

[package]
name = "particle-lab"
description = "PARTICLE LAB: live authoring for deterministic Joy Engine particle effects."
version = "0.2.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
# Integration tests are listed explicitly.
autotests = false

[lib]
path = "src/lib.rs"
# `cdylib` is the browser module; `rlib` serves the native binary, tests, and Joy Editor.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "particle-lab"
path = "src/main.rs"

[[test]]
name = "particle-lab"
path = "test/rust/main.rs"

[features]
default = ["web-entry"]
# The browser entry point (`web_main!`). Hosts that embed PARTICLE LAB, such as Joy Editor, turn it off so their own
# entry point is the only one in the build.
web-entry = []

[dependencies]
joy-engine.workspace = true

[lints]
workspace = true
