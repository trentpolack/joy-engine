# Determinism: `f64` is the engine's simulation precision, and the standard library's transcendental functions call the
# platform's C library natively and a different implementation in WebAssembly. `f64` code calls
# `joy_core::math::deterministic` (`joy_engine::math::deterministic`) instead, which computes the same result on every target.
disallowed-methods = [
  { path = "f64::sin", reason = "use joy_core::math::deterministic::sin, which matches on every target" },
  { path = "f64::cos", reason = "use joy_core::math::deterministic::cos, which matches on every target" },
  { path = "f64::tan", reason = "use joy_core::math::deterministic::tan, which matches on every target" },
  { path = "f64::sin_cos", reason = "use joy_core::math::deterministic::sin_cos, which matches on every target" },
  { path = "f64::asin", reason = "use joy_core::math::deterministic::asin, which matches on every target" },
  { path = "f64::acos", reason = "use joy_core::math::deterministic::acos, which matches on every target" },
  { path = "f64::atan", reason = "use joy_core::math::deterministic::atan, which matches on every target" },
  { path = "f64::atan2", reason = "use joy_core::math::deterministic::atan2, which matches on every target" },
  { path = "f64::sinh", reason = "use joy_core::math::deterministic::sinh, which matches on every target" },
  { path = "f64::cosh", reason = "use joy_core::math::deterministic::cosh, which matches on every target" },
  { path = "f64::tanh", reason = "use joy_core::math::deterministic::tanh, which matches on every target" },
  { path = "f64::asinh", reason = "use joy_core::math::deterministic::asinh, which matches on every target" },
  { path = "f64::acosh", reason = "use joy_core::math::deterministic::acosh, which matches on every target" },
  { path = "f64::atanh", reason = "use joy_core::math::deterministic::atanh, which matches on every target" },
  { path = "f64::exp", reason = "use joy_core::math::deterministic::exp, which matches on every target" },
  { path = "f64::exp2", reason = "use joy_core::math::deterministic::exp2, which matches on every target" },
  { path = "f64::exp_m1", reason = "use joy_core::math::deterministic::exp_m1, which matches on every target" },
  { path = "f64::ln", reason = "use joy_core::math::deterministic::ln, which matches on every target" },
  { path = "f64::log", reason = "use joy_core::math::deterministic::log, which matches on every target" },
  { path = "f64::log2", reason = "use joy_core::math::deterministic::log2, which matches on every target" },
  { path = "f64::log10", reason = "use joy_core::math::deterministic::log10, which matches on every target" },
  { path = "f64::ln_1p", reason = "use joy_core::math::deterministic::ln_1p, which matches on every target" },
  { path = "f64::powf", reason = "use joy_core::math::deterministic::powf, which matches on every target" },
  { path = "f64::powi", reason = "use joy_core::math::deterministic::powi, which matches on every target" },
  { path = "f64::cbrt", reason = "use joy_core::math::deterministic::cbrt, which matches on every target" },
  { path = "f64::hypot", reason = "use joy_core::math::deterministic::hypot, which matches on every target" },
]
